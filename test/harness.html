<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>oc-go chip harness</title>
<style>
/* OpenChamber light tokens, copied verbatim from @openchamber/web dist/assets/index-*.css */
:root{color-scheme:light;-webkit-font-smoothing:antialiased;--oc-glass-blur:22px;--oc-glass-opacity:52%;--oc-glass-saturation:1.24;--text-meta:.8125rem;--background:oklch(97% .02 85);--foreground:oklch(25% .02 40);--card:oklch(99% .01 90);--card-foreground:oklch(25% .02 40);--popover:oklch(99% .01 90);--popover-foreground:oklch(25% .02 40);--primary:oklch(65% .2 55);--primary-foreground:oklch(99% .01 90);--secondary:oklch(92% .02 80);--secondary-foreground:oklch(25% .02 40);--muted:oklch(90% .015 75);--muted-foreground:oklch(45% .02 50);--accent:oklch(92% .02 80);--accent-foreground:oklch(25% .02 40);--destructive:oklch(55% .25 25);--destructive-foreground:oklch(99% .01 90);--border:oklch(85% .02 70);--input:oklch(88% .02 75);--ring:oklch(65% .2 55);--radius:.5625rem;--chart-1:oklch(58% .15 230);--chart-2:oklch(58% .15 145);--chart-3:oklch(65% .2 55);--chart-4:oklch(55% .18 30);--chart-5:oklch(60% .16 85);--sidebar:oklch(95% .02 80);--sidebar-foreground:oklch(25% .02 40)}
.dark{--oc-glass-blur:26px;--oc-glass-opacity:50%;--oc-glass-saturation:1.16;--background:oklch(16% .01 30);--foreground:oklch(85% .02 90);--card:oklch(19% .01 40);--card-foreground:oklch(85% .02 90);--popover:oklch(24% .01 40);--popover-foreground:oklch(85% .02 90);--primary:oklch(77% .17 85);--primary-foreground:oklch(16% .01 30);--secondary:oklch(29% .01 40);--secondary-foreground:oklch(85% .02 90);--muted:oklch(33% .01 40);--muted-foreground:oklch(75% .02 80);--accent:oklch(29% .01 40);--accent-foreground:oklch(85% .02 90);--destructive:oklch(65% .15 30);--destructive-foreground:oklch(90% .02 80);--border:oklch(31% .01 35);--input:oklch(33% .01 40);--ring:oklch(77% .17 85);--chart-1:oklch(68% .12 230);--chart-2:oklch(68% .12 145);--chart-3:oklch(70% .13 95);--chart-4:oklch(65% .14 45);--chart-5:oklch(68% .12 55);--sidebar:oklch(16% .01 30);--sidebar-foreground:oklch(85% .02 90)}
html,body{margin:0;height:100%}
body{background:var(--background);color:var(--foreground);font:14px system-ui}
</style>
</head>
<body>
<script>
const params = new URLSearchParams(location.search);
if (params.get('theme') === 'dark') document.documentElement.classList.add('dark');

// Fixed clock for previews: ?at=HH:MM means that JST wall time on Tue 2026-10-13.
const at = params.get('at');
if (at) {
  const [h, m] = at.split(':').map(Number);
  const fixed = Date.UTC(2026, 9, 13, h - 9, m, 0); // JST = UTC+9
  Date.now = () => fixed;
}

// ---- mock storage.local (content.js caches quota fingerprints there) ----
const mem = {};
globalThis.chrome = { storage: { local: {
  get: (k) => Promise.resolve(Object.fromEntries(([].concat(k)).map((x) => [x, mem[x]]))),
  set: (o) => { Object.assign(mem, o); return Promise.resolve(); },
  remove: (k) => { for (const x of [].concat(k)) delete mem[x]; return Promise.resolve(); },
} } };

// ---- mock the OpenChamber API (shapes from a live 2.3.1 server) ----
const KEYS = [
  { id: 'cred_10bf5520e0010Bmhurn01FXW8n', label: 'OpenCode Go 2' },
  { id: 'cred_10bf3ee2c001eOdoWWAIZch2AD', label: 'OpenCode Go' },
];
const POOLS = {
  cred_10bf5520e0010Bmhurn01FXW8n: { '5h': [7, '9:21 PM', 6100], weekly: [3, 'Mon, Oct 19, 9:00 AM', 280000], monthly: [92, 'Sat, Oct 24, 9:08 AM', 900000] },
  cred_10bf3ee2c001eOdoWWAIZch2AD: { '5h': [99, '6:41 PM', 300], weekly: [56, 'Mon, Oct 19, 9:00 AM', 300000], monthly: [68, 'Thu, Nov 5, 8:50 PM', 1500000] },
};
let active = KEYS[0].id;
const quota = () => {
  const pool = POOLS[active];
  const windows = {};
  for (const k of ['5h', 'weekly', 'monthly']) {
    const [usedPercent, resetAtFormatted, resetAfterSeconds] = pool[k];
    windows[k] = { usedPercent, remainingPercent: 100 - usedPercent, windowSeconds: null,
      resetAfterSeconds, resetAt: Date.now() + resetAfterSeconds * 1000, resetAtFormatted };
  }
  return { providerId: 'opencode-go', providerName: 'OpenCode Go', ok: true, configured: true,
    usage: { windows }, fetchedAt: Date.now() };
};
window.fetch = (url, opts) => {
  const path = String(url).replace(location.origin, '');
  const method = (opts && opts.method) || 'GET';
  const body = (data) => Promise.resolve({ ok: true, status: 200, json: () => Promise.resolve(data) });
  if (path === '/api/integration/opencode-go') return body({ data: { id: 'opencode-go', name: 'OpenCode Go', connections: KEYS.map((k) => ({ type: 'credential', method: 'key', ...k })) } });
  if (path === '/api/quota/opencode-go') return body(quota());
  const act = path.match(/^\/api\/credential\/([^/]+)\/activate$/);
  if (act && method === 'POST') { active = decodeURIComponent(act[1]); return Promise.resolve({ ok: true, status: 204, json: () => Promise.resolve(null) }); }
  return Promise.resolve({ ok: false, status: 404, json: () => Promise.resolve({}) });
};
</script>
<!-- the real widget -->
<script src="/shared.js"></script>
<script src="/content.js"></script>
<script>
// open the chip so screenshots show the expanded state
document.getElementById('oc-usage-ext').shadowRoot.getElementById('hdr').click();
</script>
</body>
</html>
